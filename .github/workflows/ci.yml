name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  tienda:
    name: Tienda · tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true

  panel:
    name: Panel · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: true
